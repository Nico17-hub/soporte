<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Cliente</h2>

    <form class="form-horizontal"
          th:object="${entity}"
          th:action="@{/clientes}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label class="control-label col-sm-2">Nombre:</label>
            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{nombre}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Apellido:</label>
            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{apellido}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Tipo Documento:</label>
            <div class="col-sm-5">

                <select class="form-control"
                        th:field="*{tipodoc.id}">

                    <option th:each="tipo : ${tiposdoc}"
                            th:value="${tipo.id}"
                            th:text="${tipo.descrip}">
                    </option>

                </select>

            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Nro. Documento:</label>
            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{nrodoc}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Dirección:</label>
            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{direccion}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Email:</label>
            <div class="col-sm-5">
                <input type="email"
                       class="form-control"
                       th:field="*{email}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Teléfono:</label>
            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{telefono}"/>
            </div>
        </div>

        <div class="form-group">
            <label class="control-label col-sm-2">Usuario:</label>
            <div class="col-sm-5">

                <select class="form-control"
                        th:field="*{usuario.id}">

                    <option th:each="usuario : ${usuarios}"
                            th:value="${usuario.id}"
                            th:text="${usuario.username}">
                    </option>

                </select>

            </div>
        </div>

        <div class="row">

            <button type="submit"
                    class="btn btn-success">
                Guardar
            </button>

            <a class="btn btn-default"
               th:href="@{/clientes}">
                Cancelar
            </a>

        </div>

        <h5 style="color:red;"
            th:text="${message}">
        </h5>

    </form>

</div>

</body>

</html>
