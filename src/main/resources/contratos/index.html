<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Servicios del Cliente</h2>

    <br>

    <h4>
        Cliente:
        <span th:text="${cliente.nombre + ' ' + cliente.apellido}"></span>
    </h4>

    <hr>

    <h4>Contratar Servicio</h4>

    <form class="form-horizontal"
          th:object="${entity}"
          th:action="@{/contratos/{clienteId}(clienteId=${cliente.id})}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Servicio:
            </label>

            <div class="col-sm-5">

                <select class="form-control"
                        th:field="*{servicio.id}">

                    <option th:each="servicio : ${servicios}"
                            th:value="${servicio.id}"
                            th:text="${servicio.descrip}">
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <div class="col-sm-offset-2 col-sm-5">

                <button type="submit"
                        class="btn btn-success">
                    Contratar
                </button>

                <a class="btn btn-default"
                   th:href="@{/clientes}">
                    Volver
                </a>

            </div>

        </div>

    </form>

    <hr>

    <h4>Servicios Contratados</h4>

    <div th:if="${not #lists.isEmpty(entities)}">

        <table class="table">

            <tr>
                <th>Servicio</th>
                <th>Fecha Alta</th>
                <th>Fecha Baja</th>
                <th>Eliminar</th>
            </tr>

            <tr th:each="contrato : ${entities}">

                <td th:text="${contrato.servicio.descrip}"></td>

                <td th:text="${contrato.fechaalta}"></td>

                <td th:text="${contrato.fechabaja}"></td>

                <td>
                    <a class="btn btn-danger"
                       th:href="@{/contratos/delete/{clienteId}/{id}
                               (clienteId=${cliente.id},id=${contrato.id})}">
                        Eliminar
                    </a>
                </td>

            </tr>

        </table>

    </div>

</div>

</body>

</html>
