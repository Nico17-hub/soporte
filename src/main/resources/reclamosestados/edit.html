<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Estado de Reclamo</h2>

    <form class="form-horizontal"
          th:object="${entity}"
          th:action="@{/reclamosestados}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Descripción:
            </label>

            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{descrip}"/>
            </div>

        </div>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Prioridad:
            </label>

            <div class="col-sm-5">
                <input type="number"
                       class="form-control"
                       th:field="*{prioridad}"/>
            </div>

        </div>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Baja:
            </label>

            <div class="col-sm-5">
                <input type="checkbox"
                       th:field="*{baja}"/>
            </div>

        </div>

        <div class="row">

            <button type="submit"
                    class="btn btn-success">
                Guardar
            </button>

            <a class="btn btn-default"
               th:href="@{/reclamosestados}">
                Cancelar
            </a>

        </div>

        <h5 style="color:red;"
            th:text="${message}">
        </h5>

    </form>

</div>

</body>

</html>
