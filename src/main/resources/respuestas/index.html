<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Respuestas del Reclamo</h2>

    <h4>
        Asunto:
        <span th:text="${reclamo.asunto}"></span>
    </h4>

    <p>
        Cliente:
        <strong th:text="${reclamo.cliente.nombre + ' ' + reclamo.cliente.apellido}">
        </strong>
    </p>

    <p>
        Mensaje:
        <span th:text="${reclamo.mensaje}"></span>
    </p>

    <hr>

    <h4>Nueva Respuesta</h4>

    <form class="form-horizontal"
          th:object="${entity}"
          th:action="@{/reclamos/{reclamoId}/respuestas(reclamoId=${reclamo.id})}"
          method="post">

        <input type="hidden"
               th:field="*{id}"/>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Prioridad:
            </label>

            <div class="col-sm-2">

                <input type="number"
                       class="form-control"
                       th:field="*{prioridad}"/>

            </div>

        </div>

        <div class="form-group">

            <div class="col-sm-offset-2 col-sm-5">

                <button type="submit"
                        class="btn btn-success">
                    Agregar Respuesta
                </button>

                <a class="btn btn-default"
                   th:href="@{/reclamos/cliente/{clienteId}(clienteId=${reclamo.cliente.id})}">
                    Volver
                </a>

            </div>

        </div>

    </form>

    <hr>

    <h4>Respuestas</h4>

    <div th:if="${not #lists.isEmpty(entities)}">

        <table class="table table-striped">

            <tr>
                <th>Fecha</th>
                <th>Fecha y Hora</th>
                <th>Prioridad</th>
                <th>Eliminar</th>
            </tr>

            <tr th:each="respuesta : ${entities}">

                <td th:text="${respuesta.fecha}"></td>

                <td th:text="${respuesta.fechahora}"></td>

                <td th:text="${respuesta.prioridad}"></td>

                <td>

                    <a class="btn btn-danger"
                       th:href="@{/reclamos/{reclamoId}/respuestas/delete/{id}
                               (reclamoId=${reclamo.id}, id=${respuesta.id})}">
                        Eliminar
                    </a>

                </td>

            </tr>

        </table>

    </div>

    <div th:if="${#lists.isEmpty(entities)}">

        <div class="alert alert-info">
            Este reclamo todavía no tiene respuestas.
        </div>

    </div>

</div>

</body>

</html>
