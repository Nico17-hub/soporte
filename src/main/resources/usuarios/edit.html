<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<!--/*/ <th:block th:insert="~{top :: top}"></th:block> /*/-->

<body>

<div class="container">

    <!--/*/ <th:block th:insert="~{header :: header}"></th:block> /*/-->

    <h2>Usuario</h2>

    <form class="form-horizontal"
          th:object="${entity}"
          th:action="@{/usuarios}"
          method="post">

        <input type="hidden"
               th:field="*{id}"/>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Usuario:
            </label>

            <div class="col-sm-5">
                <input type="text"
                       class="form-control"
                       th:field="*{username}"/>
            </div>

        </div>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Contraseña:
            </label>

            <div class="col-sm-5">
                <input type="password"
                       class="form-control"
                       th:field="*{password}"/>
            </div>

        </div>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Rol:
            </label>

            <div class="col-sm-5">

                <select class="form-control"
                        th:field="*{rol.id}">

                    <option th:each="rol : ${roles}"
                            th:value="${rol.id}"
                            th:text="${rol.descrip}">
                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label class="control-label col-sm-2">
                Inactivo:
            </label>

            <div class="col-sm-5">
                <input type="checkbox"
                       th:field="*{inactivo}"/>
            </div>

        </div>

        <div class="row">

            <button type="submit"
                    class="btn btn-success">
                Guardar
            </button>

            <a class="btn btn-default"
               th:href="@{/usuarios}">
                Cancelar
            </a>

        </div>

        <h5 style="color:red;"
            th:text="${message}">
        </h5>

    </form>

</div>

</body>

</html>
